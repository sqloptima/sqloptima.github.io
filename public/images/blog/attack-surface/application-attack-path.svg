<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="t d">
  <title id="t">Break the application attack path</title>
  <desc id="d">Attack chain with icons from internet to impact, cut by three control groups with icons.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#eaf7ff"/></linearGradient>
  </defs>
  <rect width="1200" height="640" fill="url(#bg)"/>
  <text x="600" y="36" text-anchor="middle" fill="#14324b" font-family="Segoe UI,Arial" font-size="24" font-weight="700">BREAK THE APPLICATION ATTACK PATH</text>
  <text x="600" y="62" text-anchor="middle" fill="#4a6a82" font-family="Segoe UI,Arial" font-size="14">The database trusts the app. If the app path is weak, encryption at rest will not save you.</text>

  <g font-family="Segoe UI,Arial">
    <text x="40" y="95" fill="#991b1b" font-size="12" font-weight="700">ATTACK CHAIN</text>

    <!-- Step 1 -->
    <g transform="translate(40 110)">
      <rect width="200" height="110" rx="14" fill="#102f4d" stroke="#558eb4" stroke-width="2"/>
      <circle cx="100" cy="28" r="14" fill="#1e3a5f" stroke="#67e8f9"/><path d="M92 28h16M100 20v16" stroke="#67e8f9" stroke-width="2"/>
      <text x="100" y="60" text-anchor="middle" fill="#e9f6fd" font-size="15" font-weight="700">1. Internet</text>
      <text x="100" y="82" text-anchor="middle" fill="#8fc8e8" font-size="12">public request or</text>
      <text x="100" y="98" text-anchor="middle" fill="#8fc8e8" font-size="12">stolen session</text>
    </g>
    <!-- Step 2 -->
    <g transform="translate(270 110)">
      <rect width="200" height="110" rx="14" fill="#102f4d" stroke="#558eb4" stroke-width="2"/>
      <circle cx="100" cy="28" r="14" fill="#1e3a5f" stroke="#67e8f9"/><rect x="92" y="20" width="16" height="12" rx="2" fill="none" stroke="#67e8f9" stroke-width="1.5"/>
      <text x="100" y="60" text-anchor="middle" fill="#e9f6fd" font-size="15" font-weight="700">2. Web app</text>
      <text x="100" y="82" text-anchor="middle" fill="#8fc8e8" font-size="12">injection or broken</text>
      <text x="100" y="98" text-anchor="middle" fill="#8fc8e8" font-size="12">object checks</text>
    </g>
    <!-- Step 3 -->
    <g transform="translate(500 110)">
      <rect width="200" height="110" rx="14" fill="#102f4d" stroke="#558eb4" stroke-width="2"/>
      <circle cx="100" cy="28" r="14" fill="#1e3a5f" stroke="#67e8f9"/><circle cx="100" cy="24" r="5" fill="none" stroke="#67e8f9" stroke-width="1.5"/><path d="M92 34c3-4 13-4 16 0" fill="none" stroke="#67e8f9" stroke-width="1.5"/>
      <text x="100" y="60" text-anchor="middle" fill="#e9f6fd" font-size="15" font-weight="700">3. App identity</text>
      <text x="100" y="82" text-anchor="middle" fill="#8fc8e8" font-size="12">often too powerful</text>
      <text x="100" y="98" text-anchor="middle" fill="#8fc8e8" font-size="12">read-everything role</text>
    </g>
    <!-- Step 4 -->
    <g transform="translate(730 110)">
      <rect width="200" height="110" rx="14" fill="#102f4d" stroke="#558eb4" stroke-width="2"/>
      <circle cx="100" cy="28" r="14" fill="#1e3a5f" stroke="#67e8f9"/><ellipse cx="100" cy="22" rx="8" ry="3" fill="none" stroke="#67e8f9" stroke-width="1.5"/><path d="M92 22v8c0 2 3 4 8 4s8-2 8-4v-8" fill="none" stroke="#67e8f9" stroke-width="1.5"/>
      <text x="100" y="60" text-anchor="middle" fill="#e9f6fd" font-size="15" font-weight="700">4. SQL privilege</text>
      <text x="100" y="82" text-anchor="middle" fill="#8fc8e8" font-size="12">mass SELECT, update,</text>
      <text x="100" y="98" text-anchor="middle" fill="#8fc8e8" font-size="12">or linked-server pull</text>
    </g>
    <!-- Step 5 -->
    <g transform="translate(960 110)">
      <rect width="200" height="110" rx="14" fill="#4a2430" stroke="#f87171" stroke-width="2"/>
      <circle cx="100" cy="28" r="14" fill="#7f1d1d" stroke="#fca5a5"/><path d="M94 28h12M100 22v12" stroke="#fca5a5" stroke-width="2" transform="rotate(45 100 28)"/>
      <text x="100" y="60" text-anchor="middle" fill="#fecaca" font-size="15" font-weight="700">5. Impact</text>
      <text x="100" y="82" text-anchor="middle" fill="#fca5a5" font-size="12">data leave / fraud /</text>
      <text x="100" y="98" text-anchor="middle" fill="#fca5a5" font-size="12">backup wipe risk</text>
    </g>

    <g stroke="#f77e88" stroke-width="3" fill="#f77e88">
      <path d="M240 165h22"/><path d="M262 165l-10-7v14z"/>
      <path d="M470 165h22"/><path d="M492 165l-10-7v14z"/>
      <path d="M700 165h22"/><path d="M722 165l-10-7v14z"/>
      <path d="M930 165h22"/><path d="M952 165l-10-7v14z"/>
    </g>

    <text x="40" y="265" fill="#065f46" font-size="12" font-weight="700">CONTROLS THAT CUT THE CHAIN</text>

    <g transform="translate(40 280)">
      <rect width="360" height="150" rx="14" fill="#143d38" stroke="#54d7aa"/>
      <circle cx="36" cy="36" r="20" fill="#0f3d36" stroke="#6ee7bd"/><path d="M28 36l6 6 12-14" fill="none" stroke="#6ee7bd" stroke-width="2.5"/>
      <text x="68" y="32" fill="#6ee7bd" font-size="16" font-weight="700">Secure the code path</text>
      <text x="68" y="52" fill="#86efac" font-size="12">breaks step 2</text>
      <text x="24" y="88" fill="#bdf4df" font-size="14">Parameterized queries. No string-built SQL.</text>
      <text x="24" y="114" fill="#bdf4df" font-size="14">Per-record authorization tests before release.</text>
      <text x="24" y="140" fill="#86efac" font-size="13">Cuts the chain at the web app.</text>
    </g>
    <g transform="translate(420 280)">
      <rect width="360" height="150" rx="14" fill="#143d38" stroke="#54d7aa"/>
      <circle cx="36" cy="36" r="20" fill="#0f3d36" stroke="#6ee7bd"/><rect x="28" y="28" width="16" height="16" rx="3" fill="none" stroke="#6ee7bd" stroke-width="2"/><path d="M32 36h8" stroke="#6ee7bd" stroke-width="2"/>
      <text x="68" y="32" fill="#6ee7bd" font-size="16" font-weight="700">Shrink the app identity</text>
      <text x="68" y="52" fill="#86efac" font-size="12">breaks steps 3 and 4</text>
      <text x="24" y="88" fill="#bdf4df" font-size="14">Least privilege. Separate export role.</text>
      <text x="24" y="114" fill="#bdf4df" font-size="14">Secrets in a vault, not in config files.</text>
      <text x="24" y="140" fill="#86efac" font-size="13">Limits what a stolen token can read.</text>
    </g>
    <g transform="translate(800 280)">
      <rect width="360" height="150" rx="14" fill="#143d38" stroke="#54d7aa"/>
      <circle cx="36" cy="36" r="20" fill="#0f3d36" stroke="#6ee7bd"/><path d="M28 40h16v-10h-16z" fill="none" stroke="#6ee7bd" stroke-width="2"/><path d="M32 30v-4h8v4" stroke="#6ee7bd" stroke-width="2"/>
      <text x="68" y="32" fill="#6ee7bd" font-size="16" font-weight="700">Protect recovery</text>
      <text x="68" y="52" fill="#86efac" font-size="12">limits step 5 damage</text>
      <text x="24" y="88" fill="#bdf4df" font-size="14">Network segments. No shared backup admin.</text>
      <text x="24" y="114" fill="#bdf4df" font-size="14">Isolated credentials for restore copies.</text>
      <text x="24" y="140" fill="#86efac" font-size="13">Keeps a clean way back after impact.</text>
    </g>

    <rect x="40" y="460" width="1120" height="140" rx="16" fill="#fff" stroke="#7eb8d8" stroke-width="2"/>
    <circle cx="100" cy="530" r="28" fill="#eaf7ff" stroke="#12638a" stroke-width="2"/>
    <text x="100" y="536" text-anchor="middle" fill="#12638a" font-size="18" font-weight="700">?</text>
    <text x="600" y="505" text-anchor="middle" fill="#12638a" font-size="17" font-weight="700">Practical check before you trust the app path</text>
    <text x="600" y="538" text-anchor="middle" fill="#31475a" font-size="15">Can one compromised app token read every sensitive table? Can it dump to a share?</text>
    <text x="600" y="568" text-anchor="middle" fill="#31475a" font-size="15">If yes, fix roles and dual-control export before buying another firewall feature.</text>
  </g>
</svg>
