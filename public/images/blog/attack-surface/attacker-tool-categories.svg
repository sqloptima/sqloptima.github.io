<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="t d">
  <title id="t">Attacker tool categories for defenders</title>
  <desc id="d">Nine classes of capability defenders should inventory, with icons and short defensive notes.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#eaf7ff"/></linearGradient>
  </defs>
  <rect width="1200" height="780" fill="url(#bg)"/>
  <text x="600" y="38" text-anchor="middle" fill="#14324b" font-family="Segoe UI,Arial" font-size="24" font-weight="700">WHAT TOOLS DO ATTACKERS USE?</text>
  <text x="600" y="64" text-anchor="middle" fill="#4a6a82" font-family="Segoe UI,Arial" font-size="15">Categories, not recipes. Operators use many of the same tools for honest work.</text>

  <g font-family="Segoe UI,Arial">
    <!-- 1 Credential -->
    <g transform="translate(40 90)">
      <rect width="360" height="190" rx="14" fill="#fff" stroke="#7eb8d8" stroke-width="2"/>
      <rect x="20" y="20" width="52" height="52" rx="12" fill="#123c61"/>
      <path d="M36 46h20M46 36v20" stroke="#67e8f9" stroke-width="3" stroke-linecap="round"/>
      <circle cx="46" cy="46" r="10" fill="none" stroke="#67e8f9" stroke-width="2"/>
      <text x="88" y="40" fill="#14324b" font-size="16" font-weight="700">Credential access</text>
      <text x="88" y="62" fill="#4a6a82" font-size="13">phish, spray, token theft</text>
      <text x="24" y="100" fill="#31475a" font-size="14">Steal passwords or browser tokens.</text>
      <text x="24" y="124" fill="#31475a" font-size="14">Then log in like a normal user.</text>
      <text x="24" y="160" fill="#12638a" font-size="13" font-weight="700">Defend: MFA + short-lived tokens</text>
    </g>

    <!-- 2 Access brokers -->
    <g transform="translate(420 90)">
      <rect width="360" height="190" rx="14" fill="#fff" stroke="#7eb8d8" stroke-width="2"/>
      <rect x="20" y="20" width="52" height="52" rx="12" fill="#24355f"/>
      <rect x="32" y="34" width="28" height="20" rx="3" fill="none" stroke="#c7b6ff" stroke-width="2"/>
      <path d="M38 34v-4a8 8 0 0 1 16 0v4" fill="none" stroke="#c7b6ff" stroke-width="2"/>
      <text x="88" y="40" fill="#14324b" font-size="16" font-weight="700">Access brokers</text>
      <text x="88" y="62" fill="#4a6a82" font-size="13">stolen VPN / RDP / cloud</text>
      <text x="24" y="100" fill="#31475a" font-size="14">Buy ready sessions from markets.</text>
      <text x="24" y="124" fill="#31475a" font-size="14">Skip the noisy first break-in.</text>
      <text x="24" y="160" fill="#12638a" font-size="13" font-weight="700">Defend: geo/device anomaly alerts</text>
    </g>

    <!-- 3 DB clients -->
    <g transform="translate(800 90)">
      <rect width="360" height="190" rx="14" fill="#fff" stroke="#7eb8d8" stroke-width="2"/>
      <rect x="20" y="20" width="52" height="52" rx="12" fill="#164b48"/>
      <ellipse cx="46" cy="36" rx="14" ry="6" fill="none" stroke="#6ee7bd" stroke-width="2"/>
      <path d="M32 36v12c0 4 6 6 14 6s14-2 14-6V36" fill="none" stroke="#6ee7bd" stroke-width="2"/>
      <text x="88" y="40" fill="#14324b" font-size="16" font-weight="700">Database clients</text>
      <text x="88" y="62" fill="#4a6a82" font-size="13">SSMS, sqlcmd, bcp, dumps</text>
      <text x="24" y="100" fill="#31475a" font-size="14">Your own admin tools become</text>
      <text x="24" y="124" fill="#31475a" font-size="14">the exfil path. No malware needed.</text>
      <text x="24" y="160" fill="#12638a" font-size="13" font-weight="700">Defend: PAM + session recording</text>
    </g>

    <!-- 4 Cloud / IdP -->
    <g transform="translate(40 300)">
      <rect width="360" height="190" rx="14" fill="#fff" stroke="#7eb8d8" stroke-width="2"/>
      <rect x="20" y="20" width="52" height="52" rx="12" fill="#0c4a6e"/>
      <path d="M30 48c4-10 12-14 16-14s12 4 16 14" fill="none" stroke="#7dd3fc" stroke-width="2"/>
      <circle cx="46" cy="40" r="5" fill="#7dd3fc"/>
      <text x="88" y="40" fill="#14324b" font-size="16" font-weight="700">Cloud / IdP consoles</text>
      <text x="88" y="62" fill="#4a6a82" font-size="13">Azure, AWS, Entra, IAM CLI</text>
      <text x="24" y="100" fill="#31475a" font-size="14">Control plane beats one table CVE.</text>
      <text x="24" y="124" fill="#31475a" font-size="14">Role grants open the whole estate.</text>
      <text x="24" y="160" fill="#12638a" font-size="13" font-weight="700">Defend: hardware MFA + break-glass</text>
    </g>

    <!-- 5 LOTL -->
    <g transform="translate(420 300)">
      <rect width="360" height="190" rx="14" fill="#fff" stroke="#7eb8d8" stroke-width="2"/>
      <rect x="20" y="20" width="52" height="52" rx="12" fill="#45361b"/>
      <rect x="32" y="34" width="28" height="22" rx="3" fill="none" stroke="#fcd34d" stroke-width="2"/>
      <path d="M36 42h20M36 48h14" stroke="#fcd34d" stroke-width="2"/>
      <text x="88" y="40" fill="#14324b" font-size="16" font-weight="700">Living off the land</text>
      <text x="88" y="62" fill="#4a6a82" font-size="13">PowerShell, RDP, OS admin</text>
      <text x="24" y="100" fill="#31475a" font-size="14">Built-in tools leave little to scan.</text>
      <text x="24" y="124" fill="#31475a" font-size="14">Behavior analytics matter more.</text>
      <text x="24" y="160" fill="#12638a" font-size="13" font-weight="700">Defend: EDR on jump boxes</text>
    </g>

    <!-- 6 C2 -->
    <g transform="translate(800 300)">
      <rect width="360" height="190" rx="14" fill="#fff" stroke="#7eb8d8" stroke-width="2"/>
      <rect x="20" y="20" width="52" height="52" rx="12" fill="#4a2430"/>
      <circle cx="46" cy="46" r="12" fill="none" stroke="#fca5a5" stroke-width="2"/>
      <circle cx="46" cy="46" r="4" fill="#fca5a5"/>
      <path d="M46 34v-4M46 62v4M34 46h-4M62 46h4" stroke="#fca5a5" stroke-width="2"/>
      <text x="88" y="40" fill="#14324b" font-size="16" font-weight="700">C2 / post-exploit</text>
      <text x="88" y="62" fill="#4a6a82" font-size="13">RATs, red-team frameworks</text>
      <text x="24" y="100" fill="#31475a" font-size="14">Used to keep access after entry.</text>
      <text x="24" y="124" fill="#31475a" font-size="14">Detect on hosts and jump networks.</text>
      <text x="24" y="160" fill="#12638a" font-size="13" font-weight="700">Defend: EDR/XDR + isolate mgmt</text>
    </g>

    <!-- 7 Ransomware -->
    <g transform="translate(40 510)">
      <rect width="360" height="190" rx="14" fill="#fff" stroke="#7eb8d8" stroke-width="2"/>
      <rect x="20" y="20" width="52" height="52" rx="12" fill="#7f1d1d"/>
      <path d="M34 50l8 8 16-18" fill="none" stroke="#fecaca" stroke-width="3" stroke-linecap="round"/>
      <text x="88" y="40" fill="#14324b" font-size="16" font-weight="700">Ransomware / wipers</text>
      <text x="88" y="62" fill="#4a6a82" font-size="13">encrypt or destroy recovery</text>
      <text x="24" y="100" fill="#31475a" font-size="14">Often hit backups first.</text>
      <text x="24" y="124" fill="#31475a" font-size="14">Payment does not guarantee restore.</text>
      <text x="24" y="160" fill="#12638a" font-size="13" font-weight="700">Defend: offline / WORM copies</text>
    </g>

    <!-- 8 Exfil -->
    <g transform="translate(420 510)">
      <rect width="360" height="190" rx="14" fill="#fff" stroke="#7eb8d8" stroke-width="2"/>
      <rect x="20" y="20" width="52" height="52" rx="12" fill="#155e75"/>
      <path d="M34 50h24M46 34v24" stroke="#a5f3fc" stroke-width="3" stroke-linecap="round"/>
      <path d="M38 40l8-8 8 8" fill="none" stroke="#a5f3fc" stroke-width="2"/>
      <text x="88" y="40" fill="#14324b" font-size="16" font-weight="700">Exfil channels</text>
      <text x="88" y="62" fill="#4a6a82" font-size="13">HTTPS, email, DNS, sync</text>
      <text x="24" y="100" fill="#31475a" font-size="14">Data leaves through approved paths.</text>
      <text x="24" y="124" fill="#31475a" font-size="14">Watch volume and destination.</text>
      <text x="24" y="160" fill="#12638a" font-size="13" font-weight="700">Defend: egress allowlists + DLP</text>
    </g>

    <!-- 9 Scanners -->
    <g transform="translate(800 510)">
      <rect width="360" height="190" rx="14" fill="#fff" stroke="#7eb8d8" stroke-width="2"/>
      <rect x="20" y="20" width="52" height="52" rx="12" fill="#1e3a5f"/>
      <circle cx="44" cy="44" r="10" fill="none" stroke="#93c5fd" stroke-width="2"/>
      <path d="M51 51l8 8" stroke="#93c5fd" stroke-width="3" stroke-linecap="round"/>
      <text x="88" y="40" fill="#14324b" font-size="16" font-weight="700">Scanners / exploit kits</text>
      <text x="88" y="62" fill="#4a6a82" font-size="13">internet-wide RDP/SQL/SSH</text>
      <text x="24" y="100" fill="#31475a" font-size="14">Always probing public ports.</text>
      <text x="24" y="124" fill="#31475a" font-size="14">Exposed SQL is low-hanging fruit.</text>
      <text x="24" y="160" fill="#12638a" font-size="13" font-weight="700">Defend: no public DB ports + patch</text>
    </g>
  </g>
</svg>
