<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t d">
  <title id="t">Why attackers are not detected</title>
  <desc id="d">Six plain-language blind spots with distinct icons.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#eaf7ff"/></linearGradient>
  </defs>
  <rect width="1200" height="700" fill="url(#bg)"/>
  <text x="600" y="38" text-anchor="middle" fill="#14324b" font-family="Segoe UI,Arial" font-size="24" font-weight="700">WHY ATTACKERS ARE NOT DETECTED</text>
  <text x="600" y="64" text-anchor="middle" fill="#4a6a82" font-family="Segoe UI,Arial" font-size="15">Most of the time they look like a normal login using your own tools</text>

  <g font-family="Segoe UI,Arial">
    <!-- 1 antivirus -->
    <g transform="translate(40 95)">
      <rect width="360" height="170" rx="14" fill="#fff" stroke="#f87171" stroke-width="2"/>
      <circle cx="40" cy="40" r="24" fill="#fee2e2"/>
      <path d="M32 40l5 5 12-14" fill="none" stroke="#991b1b" stroke-width="2.5"/>
      <path d="M28 52h24" stroke="#f87171" stroke-width="2" stroke-dasharray="3 2"/>
      <text x="80" y="34" fill="#991b1b" font-size="15" font-weight="700">1. Antivirus only</text>
      <text x="80" y="54" fill="#b91c1c" font-size="12">looking for malware files</text>
      <text x="20" y="95" fill="#31475a" font-size="14">Attackers often skip custom malware.</text>
      <text x="20" y="118" fill="#31475a" font-size="14">They use sqlcmd, bcp, SSMS, or the</text>
      <text x="20" y="141" fill="#31475a" font-size="14">cloud console you already trust.</text>
    </g>
    <!-- 2 login ok -->
    <g transform="translate(420 95)">
      <rect width="360" height="170" rx="14" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
      <circle cx="40" cy="40" r="24" fill="#ffedd5"/>
      <circle cx="40" cy="34" r="8" fill="none" stroke="#92400e" stroke-width="2"/>
      <path d="M28 50c4-8 20-8 24 0" fill="none" stroke="#92400e" stroke-width="2"/>
      <text x="80" y="34" fill="#92400e" font-size="15" font-weight="700">2. Login succeeded = safe</text>
      <text x="80" y="54" fill="#b45309" font-size="12">SOC watches failures more</text>
      <text x="20" y="95" fill="#31475a" font-size="14">A stolen password that works looks</text>
      <text x="20" y="118" fill="#31475a" font-size="14">like a busy employee. Large SELECT</text>
      <text x="20" y="141" fill="#31475a" font-size="14">and exports often stay quiet.</text>
    </g>
    <!-- 3 logs same host -->
    <g transform="translate(800 95)">
      <rect width="360" height="170" rx="14" fill="#fff" stroke="#a78bfa" stroke-width="2"/>
      <circle cx="40" cy="40" r="24" fill="#ede9fe"/>
      <rect x="28" y="28" width="24" height="24" rx="3" fill="none" stroke="#5b21b6" stroke-width="2"/>
      <path d="M34 36h12M34 42h8" stroke="#5b21b6" stroke-width="2"/>
      <text x="80" y="34" fill="#5b21b6" font-size="15" font-weight="700">3. Logs on the same box</text>
      <text x="80" y="54" fill="#6d28d9" font-size="12">or never shipped at all</text>
      <text x="20" y="95" fill="#31475a" font-size="14">If audit stays on the host the attacker</text>
      <text x="20" y="118" fill="#31475a" font-size="14">owns, the trail can be cleared. If the</text>
      <text x="20" y="141" fill="#31475a" font-size="14">forwarder dies, dashboards stay green.</text>
    </g>

    <!-- 4 baseline -->
    <g transform="translate(40 290)">
      <rect width="360" height="170" rx="14" fill="#fff" stroke="#34d399" stroke-width="2"/>
      <circle cx="40" cy="40" r="24" fill="#d1fae5"/>
      <path d="M28 48 V32 h8 v16 M40 48 V28 h8 v20 M52 48 V36 h8 v12" fill="none" stroke="#065f46" stroke-width="2"/>
      <text x="80" y="34" fill="#065f46" font-size="15" font-weight="700">4. No normal baseline</text>
      <text x="80" y="54" fill="#047857" font-size="12">for exports or row volume</text>
      <text x="20" y="95" fill="#31475a" font-size="14">If nobody knows what a normal day</text>
      <text x="20" y="118" fill="#31475a" font-size="14">looks like, a quiet dump of citizen</text>
      <text x="20" y="141" fill="#31475a" font-size="14">rows will not stand out.</text>
    </g>
    <!-- 5 shared admin -->
    <g transform="translate(420 290)">
      <rect width="360" height="170" rx="14" fill="#fff" stroke="#38bdf8" stroke-width="2"/>
      <circle cx="40" cy="40" r="24" fill="#e0f2fe"/>
      <circle cx="32" cy="34" r="6" fill="none" stroke="#0c4a6e" stroke-width="2"/>
      <circle cx="48" cy="34" r="6" fill="none" stroke="#0c4a6e" stroke-width="2"/>
      <path d="M24 50c3-6 10-6 14 0M42 50c3-6 10-6 14 0" fill="none" stroke="#0c4a6e" stroke-width="2"/>
      <text x="80" y="34" fill="#0c4a6e" font-size="15" font-weight="700">5. Shared admin accounts</text>
      <text x="80" y="54" fill="#0369a1" font-size="12">sa / shared DBA logins</text>
      <text x="20" y="95" fill="#31475a" font-size="14">When many people share one login,</text>
      <text x="20" y="118" fill="#31475a" font-size="14">you cannot say who ran the dump.</text>
      <text x="20" y="141" fill="#31475a" font-size="14">Investigation stalls immediately.</text>
    </g>
    <!-- 6 backup theater -->
    <g transform="translate(800 290)">
      <rect width="360" height="170" rx="14" fill="#fff" stroke="#fb923c" stroke-width="2"/>
      <circle cx="40" cy="40" r="24" fill="#ffedd5"/>
      <path d="M28 44h24v-12h-24z" fill="none" stroke="#9a3412" stroke-width="2"/>
      <path d="M32 32v-4h16v4" stroke="#9a3412" stroke-width="2"/>
      <path d="M34 38l4 4 8-10" fill="none" stroke="#c2410c" stroke-width="2"/>
      <text x="80" y="34" fill="#9a3412" font-size="15" font-weight="700">6. Backup theater</text>
      <text x="80" y="54" fill="#c2410c" font-size="12">green jobs, weak recovery</text>
      <text x="20" y="95" fill="#31475a" font-size="14">Jobs can succeed while retention is</text>
      <text x="20" y="118" fill="#31475a" font-size="14">shortened or restore is never tested.</text>
      <text x="20" y="141" fill="#31475a" font-size="14">The first real outage finds the gap.</text>
    </g>

    <rect x="40" y="500" width="1120" height="150" rx="16" fill="#0a223c" stroke="#67e8f9" stroke-width="2"/>
    <circle cx="120" cy="575" r="30" fill="#123c61" stroke="#67e8f9" stroke-width="2"/>
    <path d="M108 575h24M120 563v24" stroke="#67e8f9" stroke-width="2.5"/>
    <circle cx="120" cy="575" r="8" fill="none" stroke="#6ee7bd" stroke-width="2"/>
    <text x="640" y="555" text-anchor="middle" fill="#67e8f9" font-size="18" font-weight="700">Watch the behavior, not only the binary</text>
    <text x="640" y="590" text-anchor="middle" fill="#e9f6fd" font-size="15">Alert on odd export volume, new privilege grants, retention changes,</text>
    <text x="640" y="618" text-anchor="middle" fill="#e9f6fd" font-size="15">and missing audit heartbeats</text>
  </g>
</svg>
