<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc">
  <title id="title">Always Encrypted data flow</title><desc id="desc">The application sends plaintext to the client driver, the driver obtains a key, and only ciphertext reaches SQL Server.</desc>
  <defs><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#18334c" flood-opacity=".12"/></filter></defs><rect width="1100" height="430" rx="24" fill="#fff"/>
  <g font-family="Segoe UI,Arial"><text x="58" y="50" fill="#155e95" font-size="15" font-weight="700" letter-spacing="2">CLIENT-SIDE ENCRYPTION FLOW</text>
  <g filter="url(#s)"><rect x="55" y="95" width="215" height="245" rx="18" fill="#f4f9fd" stroke="#9fc4df"/><rect x="320" y="95" width="215" height="245" rx="18" fill="#eef9f6" stroke="#79c9ad"/><rect x="585" y="95" width="215" height="245" rx="18" fill="#fff9e9" stroke="#e9bf58"/><rect x="850" y="95" width="195" height="245" rx="18" fill="#f4f7fb" stroke="#a9bcd0"/></g>
  <g fill="#15324a" font-size="21" font-weight="700" text-anchor="middle"><text x="162" y="140">Application</text><text x="427" y="140">Client driver</text><text x="692" y="140">Key store</text><text x="947" y="140">SQL Server</text></g>
  <g fill="#516b80" font-size="15" text-anchor="middle"><text x="162" y="188">Plaintext parameter</text><text x="162" y="214">987-65-4320</text><text x="427" y="188">Reads metadata</text><text x="427" y="214">and encrypts locally</text><text x="692" y="188">Authorizes client</text><text x="692" y="214">and unwraps CEK</text><text x="947" y="188">Stores and returns</text><text x="947" y="214">ciphertext only</text></g>
  <rect x="358" y="255" width="138" height="53" rx="12" fill="#0b8c71"/><text x="427" y="278" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">ENCRYPT</text><text x="427" y="297" fill="#dcfff6" font-size="13" text-anchor="middle">before send</text><rect x="882" y="255" width="130" height="53" rx="12" fill="#173d5d"/><text x="947" y="279" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">0x01A74C…</text><text x="947" y="298" fill="#cde4f5" font-size="12" text-anchor="middle">unreadable here</text>
  <path d="M270 220h40M535 220h40M800 220h40" stroke="#2788c1" stroke-width="4"/><path d="m310 220-14-8v16zm265 0-14-8v16zm265 0-14-8v16z" fill="#2788c1"/><text x="550" y="390" fill="#587186" font-size="14" text-anchor="middle">On reads, ciphertext returns through the driver and is decrypted only for the approved application.</text></g>
</svg>
