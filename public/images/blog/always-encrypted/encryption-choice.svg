<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc">
  <title id="title">Choosing an Always Encrypted mode</title><desc id="desc">A decision tree chooses randomized encryption, deterministic encryption, or randomized encryption with a secure enclave.</desc>
  <defs><filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#18334c" flood-opacity=".12"/></filter></defs><rect width="1100" height="430" rx="24" fill="#fff"/><g font-family="Segoe UI,Arial"><rect x="390" y="30" width="320" height="74" rx="37" fill="#e9f5fc" stroke="#68acd2" filter="url(#s)"/><text x="550" y="60" fill="#15324a" font-size="18" font-weight="700" text-anchor="middle">Must SQL Server compare</text><text x="550" y="84" fill="#15324a" font-size="18" font-weight="700" text-anchor="middle">the protected value?</text><path d="M455 104 245 175m390-71 210 71" stroke="#2788c1" stroke-width="4"/><text x="330" y="140" fill="#155e95" font-size="14" font-weight="700">NO</text><text x="770" y="140" fill="#155e95" font-size="14" font-weight="700">YES</text>
  <rect x="80" y="177" width="325" height="185" rx="20" fill="#edf9f5" stroke="#5dbb9b" filter="url(#s)"/><text x="242" y="220" fill="#047857" font-size="17" font-weight="700" text-anchor="middle">RANDOMIZED</text><text x="242" y="258" fill="#15324a" font-size="20" font-weight="700" text-anchor="middle">Store and return</text><text x="242" y="293" fill="#526b80" font-size="15" text-anchor="middle">Strong pattern hiding</text><text x="242" y="318" fill="#526b80" font-size="15" text-anchor="middle">without server-side search</text>
  <rect x="695" y="177" width="325" height="76" rx="20" fill="#f2f7fb" stroke="#82abc8" filter="url(#s)"/><text x="857" y="207" fill="#15324a" font-size="17" font-weight="700" text-anchor="middle">Only exact equality?</text><text x="857" y="232" fill="#526b80" font-size="14" text-anchor="middle">lookup, join, group, index</text><path d="M790 253 700 300m150-47 90 47" stroke="#2788c1" stroke-width="4"/><text x="735" y="278" fill="#155e95" font-size="13" font-weight="700">YES</text><text x="910" y="278" fill="#155e95" font-size="13" font-weight="700">NO</text>
  <rect x="565" y="305" width="250" height="82" rx="16" fill="#fff8e6" stroke="#e2b94e" filter="url(#s)"/><text x="690" y="339" fill="#8a6200" font-size="16" font-weight="700" text-anchor="middle">DETERMINISTIC</text><text x="690" y="365" fill="#526b80" font-size="14" text-anchor="middle">reveals equality patterns</text><rect x="835" y="305" width="235" height="82" rx="16" fill="#f4efff" stroke="#a58bd7" filter="url(#s)"/><text x="952" y="334" fill="#6445a2" font-size="15" font-weight="700" text-anchor="middle">RANDOMIZED</text><text x="952" y="357" fill="#15324a" font-size="14" text-anchor="middle">+ SECURE ENCLAVE</text><text x="952" y="377" fill="#6c6281" font-size="12" text-anchor="middle">for supported rich queries</text></g>
</svg>
