<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" role="img" aria-labelledby="title desc">
  <title id="title">Always Encrypted key hierarchy</title><desc id="desc">The column master key in an external store wraps the column encryption key, and that key protects encrypted column values.</desc>
  <defs><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#18334c" flood-opacity=".12"/></filter></defs><rect width="1100" height="420" rx="24" fill="#fff"/><text x="550" y="48" fill="#15324a" font-family="Segoe UI,Arial" font-size="24" font-weight="700" text-anchor="middle">One key protects another</text>
  <g font-family="Segoe UI,Arial" filter="url(#s)"><rect x="55" y="92" width="290" height="245" rx="22" fill="#eff7fd" stroke="#8cbada"/><rect x="405" y="92" width="290" height="245" rx="22" fill="#fff8e6" stroke="#e2b94e"/><rect x="755" y="92" width="290" height="245" rx="22" fill="#eefaf6" stroke="#6cc3a5"/></g>
  <g font-family="Segoe UI,Arial" text-anchor="middle"><text x="200" y="130" fill="#155e95" font-size="13" font-weight="700" letter-spacing="1.2">EXTERNAL KEY STORE</text><circle cx="200" cy="192" r="34" fill="#f4b926"/><circle cx="200" cy="192" r="11" fill="#fff"/><path d="M229 192h50m-18 0v20m-18-20v13" stroke="#f4b926" stroke-width="12"/><text x="200" y="265" fill="#15324a" font-size="24" font-weight="700">CMK</text><text x="200" y="291" fill="#526b80" font-size="14">wraps the encryption key</text>
  <text x="550" y="130" fill="#926700" font-size="13" font-weight="700" letter-spacing="1.2">DATABASE METADATA</text><text x="550" y="174" fill="#15324a" font-size="22" font-weight="700">Wrapped CEK</text><rect x="495" y="199" width="110" height="58" rx="11" fill="#f4b926"/><path d="M514 199v-13a36 36 0 0 1 72 0v13" fill="none" stroke="#d59600" stroke-width="9"/><circle cx="550" cy="226" r="6" fill="#6b4b00"/><text x="550" y="291" fill="#526b80" font-size="14">encrypted copy is safe to store</text>
  <text x="900" y="130" fill="#047857" font-size="13" font-weight="700" letter-spacing="1.2">ENCRYPTED COLUMNS</text><g fill="#12a77f"><rect x="830" y="172" width="140" height="18" rx="9"/><rect x="830" y="207" width="112" height="18" rx="9"/><rect x="830" y="242" width="130" height="18" rx="9"/></g><text x="900" y="291" fill="#526b80" font-size="14">CEK protects every value</text><path d="M345 215h47m303 0h47" stroke="#2788c1" stroke-width="5"/><path d="m392 215-17-10v20zm350 0-17-10v20z" fill="#2788c1"/><text x="370" y="195" fill="#52728a" font-size="12">wraps</text><text x="720" y="195" fill="#52728a" font-size="12">encrypts</text></g><text x="550" y="382" fill="#60778a" font-family="Segoe UI,Arial" font-size="14" text-anchor="middle">SQL Server stores the key path and wrapped CEK—never the plaintext CMK.</text>
</svg>
