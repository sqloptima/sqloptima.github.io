<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="t d"><title id="t">Encrypted and validated SQL Server connection</title><desc id="d">An application validates the SQL Server certificate and sends encrypted TDS traffic across a segmented firewall.</desc><defs><linearGradient id="b"><stop stop-color="#eaf7ff"/><stop offset="1" stop-color="#ffffff"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="m0 0 10 5-10 5Z" fill="#6ee7b7"/></marker></defs><rect width="960" height="300" rx="24" fill="url(#b)"/><g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle"><rect x="45" y="78" width="220" height="150" rx="18" fill="#0d3152" stroke="#38bdf8" stroke-width="2"/><rect x="695" y="78" width="220" height="150" rx="18" fill="#0d3152" stroke="#34d399" stroke-width="2"/><text x="155" y="139" fill="#fff" font-size="21" font-weight="700">Application</text><text x="155" y="168" fill="#a9c3dc" font-size="14">trusted driver + CA</text><text x="805" y="139" fill="#fff" font-size="21" font-weight="700">SQL Server</text><text x="805" y="168" fill="#a9c3dc" font-size="14">trusted certificate</text><path d="M265 134h430" stroke="#6ee7b7" stroke-width="5" marker-end="url(#a)"/><path d="M695 186H265" stroke="#67e8f9" stroke-width="3" marker-end="url(#a)"/><rect x="435" y="95" width="90" height="112" rx="12" fill="#0a253e" stroke="#fbbf24" stroke-width="2"/><path d="M453 120h54M453 138h54M453 156h54M453 174h54" stroke="#fbbf24" stroke-width="4"/><text x="480" y="230" fill="#fcd34d" font-size="13" font-weight="700">SEGMENTED FIREWALL</text><g transform="translate(338 105)"><rect x="0" y="18" width="44" height="38" rx="5" fill="#34d399" opacity=".3" stroke="#6ee7b7" stroke-width="2"/><path d="M10 18V10a12 12 0 0 1 24 0v8" fill="none" stroke="#6ee7b7" stroke-width="3"/></g><text x="376" y="181" fill="#d1fae5" font-size="12">TLS / TDS 8.0</text><text x="480" y="272" fill="#a9c3dc" font-size="13">Encrypt the session • validate the endpoint • minimise the route</text></g></svg>
