<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="t d"><title id="t">Identity and least-privilege flow</title><desc id="d">A person authenticates with MFA, receives group membership, and is mapped to a least-privilege SQL role. Administrative roles remain separate.</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#071d35"/><stop offset="1" stop-color="#123f68"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="m0 0 10 5-10 5Z" fill="#67e8f9"/></marker></defs><rect width="960" height="300" rx="24" fill="url(#b)"/><g fill="none" stroke="#67e8f9" stroke-width="4" marker-end="url(#a)"><path d="M190 150h85M450 150h85M710 150h65"/></g><g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle"><g fill="#0d3152" stroke="#3dbcea" stroke-width="2"><rect x="35" y="80" width="155" height="140" rx="18"/><rect x="275" y="80" width="175" height="140" rx="18"/><rect x="535" y="80" width="175" height="140" rx="18"/><rect x="775" y="80" width="150" height="140" rx="18"/></g><g fill="#fff" font-weight="700" font-size="18"><text x="112" y="142">User / service</text><text x="362" y="132">MFA + central</text><text x="362" y="156">identity</text><text x="622" y="132">AD group +</text><text x="622" y="156">SQL role</text><text x="850" y="132">Permitted</text><text x="850" y="156">data only</text></g><g fill="#a9c3dc" font-size="13"><text x="112" y="175">named principal</text><text x="362" y="183">prove identity</text><text x="622" y="183">least privilege</text><text x="850" y="183">auditable scope</text></g></g><path d="M53 44h854" stroke="#fff" stroke-opacity=".14"/><g font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700"><text x="55" y="34" fill="#72cef7">IDENTITY PLANE</text><text x="752" y="267" fill="#fbbf24">DBA ≠ OS admin ≠ backup admin</text></g></svg>
