<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="t d"><title id="t">Security monitoring and response flow</title><desc id="d">SQL Server, operating system, identity, and backup events flow to protected audit storage, correlation, alerting, and incident response.</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#eaf7ff"/><stop offset="1" stop-color="#ffffff"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="m0 0 10 5-10 5Z" fill="#67e8f9"/></marker></defs><rect width="960" height="300" rx="24" fill="url(#b)"/><g font-family="Segoe UI,Arial,sans-serif"><g fill="#0d3152" stroke="#3dbcea" stroke-width="2"><rect x="35" y="44" width="190" height="48" rx="10"/><rect x="35" y="102" width="190" height="48" rx="10"/><rect x="35" y="160" width="190" height="48" rx="10"/><rect x="35" y="218" width="190" height="48" rx="10"/></g><g fill="#dceefa" font-size="14" font-weight="700"><text x="55" y="74">SQL Server Audit</text><text x="55" y="132">OS + EDR events</text><text x="55" y="190">Identity sign-ins</text><text x="55" y="248">Backup + storage events</text></g><path d="M225 68c70 0 55 82 120 82M225 126c65 0 55 24 120 24M225 184c65 0 55-34 120-34M225 242c70 0 55-92 120-92" fill="none" stroke="#67e8f9" stroke-width="3" marker-end="url(#a)"/><rect x="345" y="91" width="180" height="118" rx="17" fill="#15334c" stroke="#fbbf24" stroke-width="2"/><text x="435" y="133" fill="#fff" font-size="19" font-weight="700" text-anchor="middle">Protected archive</text><text x="435" y="160" fill="#fcd34d" font-size="13" text-anchor="middle">append • retain • correlate</text><text x="435" y="183" fill="#a9c3dc" font-size="12" text-anchor="middle">outside monitored host</text><path d="M525 150h80" stroke="#67e8f9" stroke-width="4" marker-end="url(#a)"/><rect x="605" y="91" width="145" height="118" rx="17" fill="#15334c" stroke="#a78bfa" stroke-width="2"/><text x="677" y="135" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">Detection</text><text x="677" y="163" fill="#d7cffd" font-size="13" text-anchor="middle">rules + baseline</text><text x="677" y="184" fill="#a9c3dc" font-size="12" text-anchor="middle">context, not noise</text><path d="M750 150h55" stroke="#67e8f9" stroke-width="4" marker-end="url(#a)"/><rect x="805" y="91" width="120" height="118" rx="17" fill="#123f3b" stroke="#34d399" stroke-width="2"/><text x="865" y="135" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">Response</text><text x="865" y="162" fill="#b9eadc" font-size="13" text-anchor="middle">isolate</text><text x="865" y="183" fill="#b9eadc" font-size="13" text-anchor="middle">preserve • recover</text></g></svg>
