<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="t d"><title id="t">Data protection layers by state</title><desc id="d">Sensitive columns are protected with Always Encrypted, the client connection with TLS, database files with TDE, and backup files with separate backup encryption and key custody.</desc><defs><linearGradient id="b" x2="1"><stop stop-color="#eaf7ff"/><stop offset="1" stop-color="#ffffff"/></linearGradient></defs><rect width="960" height="340" rx="24" fill="url(#b)"/><g font-family="Segoe UI,Arial,sans-serif"><text x="45" y="43" fill="#12638a" font-size="13" font-weight="700">MATCH THE CONTROL TO THE DATA STATE</text><g transform="translate(45 72)"><rect width="870" height="55" rx="13" fill="#123d59" stroke="#67e8f9"/><text x="25" y="34" fill="#fff" font-size="18" font-weight="700">IN TRANSIT</text><text x="190" y="34" fill="#b8dcf0" font-size="15">TLS + certificate validation + strict encryption</text><text x="824" y="34" fill="#67e8f9" font-size="13" text-anchor="end">THE WIRE</text></g><g transform="translate(45 139)"><rect width="870" height="55" rx="13" fill="#16374f" stroke="#a78bfa"/><text x="25" y="34" fill="#fff" font-size="18" font-weight="700">IN USE</text><text x="190" y="34" fill="#d7cffd" font-size="15">Always Encrypted + optional secure enclave</text><text x="824" y="34" fill="#c4b5fd" font-size="13" text-anchor="end">SENSITIVE COLUMNS</text></g><g transform="translate(45 206)"><rect width="870" height="55" rx="13" fill="#113c47" stroke="#34d399"/><text x="25" y="34" fill="#fff" font-size="18" font-weight="700">AT REST</text><text x="190" y="34" fill="#b9eadc" font-size="15">TDE + protected certificate and master key</text><text x="824" y="34" fill="#6ee7b7" font-size="13" text-anchor="end">MDF • LDF • TEMPDB</text></g><g transform="translate(45 273)"><rect width="870" height="55" rx="13" fill="#45361b" stroke="#fbbf24"/><text x="25" y="34" fill="#fff" font-size="18" font-weight="700">RECOVERY</text><text x="190" y="34" fill="#fce6ad" font-size="15">Backup encryption + separate keys + isolated copy</text><text x="824" y="34" fill="#fcd34d" font-size="13" text-anchor="end">FULL • DIFF • LOG</text></g></g></svg>
