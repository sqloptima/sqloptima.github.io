<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">Clean SQL Server ransomware recovery</title><desc id="d">Incident response proceeds from detection through a clean rebuild and validated return to service.</desc><rect width="1200" height="520" fill="#eaf7ff"/><g font-family="Segoe UI,Arial"><text x="600" y="58" text-anchor="middle" fill="#14324b" font-size="29" font-weight="700">RECOVER THE TRUST BOUNDARY</text><g fill="#102f4d" stroke="#4e91b9" stroke-width="2"><rect x="40" y="120" width="200" height="90" rx="16"/><rect x="275" y="120" width="200" height="90" rx="16"/><rect x="510" y="120" width="200" height="90" rx="16"/><rect x="745" y="120" width="200" height="90" rx="16"/><rect x="980" y="120" width="180" height="90" rx="16"/><rect x="155" y="315" width="200" height="90" rx="16"/><rect x="390" y="315" width="200" height="90" rx="16"/><rect x="625" y="315" width="200" height="90" rx="16"/><rect x="860" y="315" width="200" height="90" rx="16"/></g><g fill="#e9f6fd" text-anchor="middle" font-size="19" font-weight="650"><text x="140" y="158">Detect &amp;</text><text x="140" y="184">preserve</text><text x="375" y="158">Contain &amp;</text><text x="375" y="184">scope</text><text x="610" y="158">Clean OS +</text><text x="610" y="184">clean SQL</text><text x="845" y="158">Harden +</text><text x="845" y="184">restore keys</text><text x="1070" y="158">Restore</text><text x="1070" y="184">chain</text><text x="255" y="353">CHECKDB +</text><text x="255" y="379">app tests</text><text x="490" y="353">Rotate identities</text><text x="490" y="379">and keys</text><text x="725" y="353">Reconnect</text><text x="725" y="379">production</text><text x="960" y="353">Lessons</text><text x="960" y="379">learned</text></g><g stroke="#69d2f7" stroke-width="3" fill="none"><path d="M240 165h35M475 165h35M710 165h35M945 165h35M1070 210v55H255v50M355 360h35M590 360h35M825 360h35"/></g><text x="600" y="474" text-anchor="middle" fill="#8a4b00" font-size="19">A database restore is complete only when the environment, integrity, application, identities, and timing are trusted.</text></g></svg>
