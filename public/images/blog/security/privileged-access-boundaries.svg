<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d"><title id="t">Separated privileged access boundaries</title><desc id="d">Independent administrators surround SQL Server without one identity controlling every security layer.</desc><rect width="1200" height="560" fill="#eaf7ff"/><g font-family="Segoe UI,Arial"><circle cx="600" cy="280" r="116" fill="#123f65" stroke="#65d5ff" stroke-width="3"/><text x="600" y="268" text-anchor="middle" fill="#fff" font-size="30" font-weight="700">SQL SERVER</text><text x="600" y="305" text-anchor="middle" fill="#a9d9f2" font-size="18">least-privilege roles</text><g fill="#102f4d" stroke="#3c86b1" stroke-width="2"><rect x="60" y="70" width="250" height="86" rx="18"/><rect x="475" y="32" width="250" height="86" rx="18"/><rect x="890" y="70" width="250" height="86" rx="18"/><rect x="60" y="404" width="250" height="86" rx="18"/><rect x="475" y="442" width="250" height="86" rx="18"/><rect x="890" y="404" width="250" height="86" rx="18"/></g><g fill="#e5f4fc" text-anchor="middle" font-size="21" font-weight="650"><text x="185" y="123">DBA / SQL admin</text><text x="600" y="85">OS administrator</text><text x="1015" y="123">Security / auditor</text><text x="185" y="458">Application identity</text><text x="600" y="495">Backup operator</text><text x="1015" y="458">Storage administrator</text></g><g stroke="#5d9fc4" stroke-width="3" stroke-dasharray="8 8"><path d="M310 145l200 73"/><path d="M600 118v46"/><path d="M890 145l-200 73"/><path d="M310 415l200-73"/><path d="M600 442v-46"/><path d="M890 415l-200-73"/></g><text x="600" y="552" text-anchor="middle" fill="#8a4b00" font-size="18">No single standing identity should control data, logs, keys, retention, and the final recovery copy.</text></g></svg>
