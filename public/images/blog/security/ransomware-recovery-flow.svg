<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="t d"><title id="t">Ransomware-resilient backup and recovery flow</title><desc id="d">Full, differential and transaction log backups pass checksum, verification and hashing before isolated storage and a timed clean restore.</desc><defs><linearGradient id="b" x2="1"><stop stop-color="#071d35"/><stop offset="1" stop-color="#123f63"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="m0 0 10 5-10 5Z" fill="#6ee7b7"/></marker></defs><rect width="960" height="320" rx="24" fill="url(#b)"/><g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle"><g fill="#0d3152" stroke-width="2"><rect x="30" y="90" width="175" height="145" rx="18" stroke="#38bdf8"/><rect x="270" y="90" width="180" height="145" rx="18" stroke="#fbbf24"/><rect x="515" y="90" width="180" height="145" rx="18" stroke="#34d399"/><rect x="760" y="90" width="170" height="145" rx="18" stroke="#a78bfa"/></g><g fill="#fff" font-size="18" font-weight="700"><text x="117" y="131">Backup chain</text><text x="360" y="131">Verify before copy</text><text x="605" y="131">Isolated storage</text><text x="845" y="131">Clean restore</text></g><g fill="#a9c3dc" font-size="13"><text x="117" y="162">FULL • DIFF • LOG</text><text x="117" y="185">encryption + CHECKSUM</text><text x="360" y="162">VERIFYONLY • SHA-256</text><text x="360" y="185">record chain history</text><text x="605" y="162">separate credentials</text><text x="605" y="185">off-site • object lock</text><text x="845" y="162">keys + integrity</text><text x="845" y="185">application + RPO/RTO</text></g><g fill="none" stroke="#6ee7b7" stroke-width="4" marker-end="url(#a)"><path d="M205 162h65M450 162h65M695 162h65"/></g><text x="480" y="49" fill="#72cef7" font-size="13" font-weight="700">PRODUCTION TRUST ENDS BEFORE THE RECOVERY COPY BEGINS</text><path d="M480 68v190" stroke="#fb923c" stroke-width="2" stroke-dasharray="7 7"/><text x="480" y="287" fill="#fcd34d" font-size="13">independent identity • storage • keys • administration</text></g></svg>
